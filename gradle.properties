# Gradle instellingen
org.gradle.jvmargs=-Xmx1G
org.gradle.parallel=true

# --------------------------------------------------------------------------
# Gecontroleerd via web search (24 sept 2026):
# - minecraft_version 1.21.11 bestaat en is de huidige/laatste versie.
# - loader_version 0.19.5 bestaat en is de nieuwste Fabric Loader release.
# - fabric_version: bevestigde bestaande builds voor 1.21.11 zijn o.a.
#   0.141.3+1.21.11 en 0.139.5+1.21.11 (gebruikt: 0.141.3+1.21.11).
# - yarn_mappings: het exacte build-nummer kon ik niet met zekerheid
#   vaststellen. Check de hoogste beschikbare build voor 1.21.11 op
#   https://maven.fabricmc.net/net/fabricmc/yarn/ en pas de regel
#   hieronder aan (bv. 1.21.11+build.3) voordat je bouwt.
#   LET OP: 1.21.11 is de LAATSTE geobfusceerde Minecraft-versie; Fabric
#   raadt voor deze versie ook aan om te overwegen naar de officiële
#   Mojang-mappings te migreren (loom.officialMojangMappings()) i.p.v.
#   Yarn, omdat Yarn na deze versie stopt. Voor nu blijft dit project op
#   Yarn staan omdat de meegeleverde Java-code Yarn-namen gebruikt.
# --------------------------------------------------------------------------
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.3
loader_version=0.19.5
fabric_version=0.141.3+1.21.11

# Mod info
mod_version=1.0.0
maven_group=com.example.snowybiomes
archives_base_name=snowybiomes
